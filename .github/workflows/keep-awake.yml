# 심사 기간 동안 Render 무료 서버(15분 무접속 시 잠듦)가 잠들지 않도록 접속(UptimeRobot 대체)
# GitHub 예약 실행은 바쁠 때 수십 분씩 늦어지므로, 한 번 실행되면 약 50분 동안 5분마다 접속해 빈틈을 메운다.
name: keep-awake
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: keep-awake
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: lawon.onrender.com 5분마다 상태 확인(약 50분)
        run: |
          for i in $(seq 1 11); do
            code=$(curl -s -m 90 -o /tmp/h.json -w "%{http_code}" https://lawon.onrender.com/api/health || echo 000)
            echo "$(date -u +%H:%M:%S) HTTP $code $(cat /tmp/h.json 2>/dev/null)"
            [ "$i" -lt 11 ] && sleep 290
          done
